<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 340 400"
    width="340"
    height="400">

  <defs>

    <linearGradient
        id="window-sky"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#fbfdfd"/>

      <stop offset="65%"
            stop-color="#e4f1f2"/>

      <stop offset="100%"
            stop-color="#cfe6e8"/>

    </linearGradient>


    <linearGradient
        id="window-frame"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#d9cfb8"/>

      <stop offset="45%"
            stop-color="#ece4d0"/>

      <stop offset="100%"
            stop-color="#cabfa3"/>

    </linearGradient>


    <linearGradient
        id="window-blind"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#8296ab"/>

      <stop offset="100%"
            stop-color="#6d8195"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       WINDOW — tall wood-framed sash window with a blue-grey
       roller blind pulled up to the top, as in the photo.
       ========================================================= -->

  <g
      id="window"
      class="hotspot"
      data-spot="window">


    <!-- =========================================================
         INVISIBLE INTERACTION AREA
         ========================================================= -->

    <rect
        class="hit"
        x="0"
        y="0"
        width="340"
        height="400"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         WALL RECESS
         ========================================================= -->

    <rect
        x="0"
        y="0"
        width="340"
        height="380"
        fill="#e9ebee"/>


    <!-- =========================================================
         OUTER FRAME — light, weathered cream/wood tone
         ========================================================= -->

    <rect
        x="15"
        y="25"
        width="310"
        height="325"
        fill="#e7e0cf"
        stroke="#b7a97e"
        stroke-width="3"/>


    <!-- =========================================================
         GLASS
         ========================================================= -->

    <rect
        x="32"
        y="42"
        width="276"
        height="280"
        fill="url(#window-sky)"/>


    <!-- bright outside wash -->

    <rect
        x="32"
        y="42"
        width="276"
        height="280"
        fill="#f6fbfb"
        opacity=".3"/>


    <!-- soft hint of buildings/sky outside -->

    <path
        d="
          M32 220
          C75 195 110 208 150 222
          C190 238 230 200 265 210
          C285 216 298 208 308 196
          L308 322
          L32 322
          Z"
        fill="#c7dfe1"
        opacity=".5"/>


    <!-- =========================================================
         WINDOW SASH DIVISIONS — one vertical, one horizontal,
         matching the four-pane look in the photo
         ========================================================= -->

    <rect
        x="166"
        y="42"
        width="8"
        height="280"
        fill="#c2b48c"/>

    <rect
        x="32"
        y="178"
        width="276"
        height="8"
        fill="#c2b48c"/>


    <!-- =========================================================
         ROLLER BLIND — pulled all the way up, tucked behind
         the top of the frame, spanning the full width
         ========================================================= -->

    <g id="window-blind">

      <rect
          x="15"
          y="25"
          width="310"
          height="46"
          fill="url(#window-blind)"/>

      <rect
          x="15"
          y="66"
          width="310"
          height="6"
          fill="#59697b"/>

      <g
          stroke="#5c6f82"
          stroke-width="3"
          opacity=".6">

        <line x1="55" y1="30" x2="55" y2="66"/>
        <line x1="105" y1="30" x2="105" y2="66"/>
        <line x1="155" y1="30" x2="155" y2="66"/>
        <line x1="205" y1="30" x2="205" y2="66"/>
        <line x1="255" y1="30" x2="255" y2="66"/>
        <line x1="300" y1="30" x2="300" y2="66"/>

      </g>

    </g>


    <!-- =========================================================
         WOOD HIGHLIGHTS
         ========================================================= -->

    <rect
        x="17"
        y="27"
        width="6"
        height="321"
        fill="#f2ecdc"
        opacity=".5"/>


    <!-- =========================================================
         WINDOW SILL
         ========================================================= -->

    <rect
        x="0"
        y="350"
        width="340"
        height="22"
        fill="#dedad0"/>

    <rect
        x="0"
        y="370"
        width="340"
        height="10"
        fill="#c7c2b6"/>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <rect
        class="glow"
        x="15"
        y="25"
        width="310"
        height="325"
        rx="4"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>

<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 355 385"
    width="355"
    height="385">

  <defs>

    <!-- =========================================================
         OUTDOOR LIGHT
         ========================================================= -->

    <linearGradient
        id="windowSky"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#f8fcfc"/>

      <stop offset="65%"
            stop-color="#dceff1"/>

      <stop offset="100%"
            stop-color="#c5dfe2"/>

    </linearGradient>


    <!-- =========================================================
         WOOD FRAME
         ========================================================= -->

    <linearGradient
        id="woodFrame"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#a77d54"/>

      <stop offset="45%"
            stop-color="#c19a6d"/>

      <stop offset="100%"
            stop-color="#956d49"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       WINDOW ROOT
       ========================================================= -->

  <g
      id="window"
      class="hotspot"
      data-spot="window">


    <!-- =========================================================
         INVISIBLE INTERACTION AREA
         ========================================================= -->

    <rect
        class="hit"
        x="0"
        y="0"
        width="355"
        height="385"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         WALL RECESS
         ========================================================= -->

    <rect
        x="0"
        y="0"
        width="355"
        height="370"
        fill="#e7e7e2"/>


    <!-- =========================================================
         OUTER WOOD FRAME
         ========================================================= -->

    <rect
        x="20"
        y="35"
        width="315"
        height="315"
        fill="url(#woodFrame)"
        stroke="#8e6746"
        stroke-width="3"/>


    <!-- =========================================================
         GLASS
         ========================================================= -->

    <rect
        x="35"
        y="55"
        width="285"
        height="255"
        fill="url(#windowSky)"/>


    <!-- =========================================================
         BRIGHT OUTSIDE
         ========================================================= -->

    <rect
        x="35"
        y="55"
        width="285"
        height="255"
        fill="#f5fbfb"
        opacity=".38"/>


    <!-- =========================================================
         ABSTRACT OUTDOOR BUILDINGS / LIGHT
         ========================================================= -->

    <path
        d="
          M35 205
          C80 180 115 192 155 208
          C195 225 235 185 270 195
          C292 201 305 194 320 180
          L320 310
          L35 310
          Z"
        fill="#c7dfe1"
        opacity=".60"/>


    <rect
        x="65"
        y="130"
        width="70"
        height="80"
        fill="#e8f3f3"
        opacity=".6"/>


    <rect
        x="210"
        y="110"
        width="55"
        height="100"
        fill="#e2eeee"
        opacity=".5"/>


    <!-- =========================================================
         WINDOW DIVIDER — VERTICAL
         ========================================================= -->

    <rect
        x="174"
        y="55"
        width="8"
        height="255"
        fill="#a87d52"/>


    <!-- =========================================================
         WINDOW DIVIDER — HORIZONTAL
         ========================================================= -->

    <rect
        x="35"
        y="177"
        width="285"
        height="8"
        fill="#a87d52"/>


    <!-- =========================================================
         WOOD HIGHLIGHTS
         ========================================================= -->

    <rect
        x="22"
        y="38"
        width="7"
        height="308"
        fill="#d1a477"
        opacity=".45"/>


    <rect
        x="24"
        y="38"
        width="307"
        height="7"
        fill="#d1a477"
        opacity=".45"/>


    <!-- =========================================================
         WINDOW SILL
         ========================================================= -->

    <rect
        x="5"
        y="350"
        width="345"
        height="25"
        fill="#e0ddd5"/>


    <rect
        x="5"
        y="373"
        width="345"
        height="12"
        fill="#c9c4ba"/>


    <!-- =========================================================
         SILL SHADOW
         ========================================================= -->

    <rect
        x="25"
        y="375"
        width="305"
        height="7"
        fill="#99958c"
        opacity=".25"/>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <rect
        class="glow"
        x="0"
        y="0"
        width="355"
        height="385"
        rx="5"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>
<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 195 155"
    width="195"
    height="155">

  <!-- =========================================================
       WALL PICTURE — landscape framed abstract print
       (tan/beige geometric shapes, light wood frame),
       matching the picture above the sofa in the photo.
       ========================================================= -->

  <g id="wall-picture">


    <!-- shadow -->

    <rect
        x="9"
        y="9"
        width="182"
        height="142"
        fill="#8a8a86"
        opacity=".2"/>


    <!-- frame -->

    <rect
        x="3"
        y="3"
        width="182"
        height="142"
        fill="#c3a37a"
        stroke="#96754f"
        stroke-width="4"/>


    <!-- mat / inner frame -->

    <rect
        x="15"
        y="15"
        width="158"
        height="118"
        fill="#f1ede2"/>


    <!-- =========================================================
         ABSTRACT ARTWORK — overlapping angular tan/grey shapes,
         echoing the mountain-like print in the photo
         ========================================================= -->

    <path
        d="
          M28 118
          L58 55
          L82 90
          L102 40
          L118 62
          L140 32
          L160 118
          Z"
        fill="#cf9f56"
        opacity=".85"/>

    <path
        d="
          M28 122
          L70 78
          L104 122
          Z"
        fill="#8d7c62"
        opacity=".8"/>

    <circle
        cx="132"
        cy="46"
        r="12"
        fill="#dccf9d"/>

    <path
        d="M32 100 Q60 68 88 84"
        fill="none"
        stroke="#a9bcb4"
        stroke-width="5"
        opacity=".7"/>

  </g>

</svg>

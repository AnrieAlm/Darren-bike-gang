<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 720"
    width="800"
    height="720">

  <defs>

    <!-- =========================================================
         CABINET MATERIAL
         ========================================================= -->

    <linearGradient
        id="cabinet-white"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#d9dad7"/>

      <stop offset="50%"
            stop-color="#f0f0ec"/>

      <stop offset="100%"
            stop-color="#d1d2cf"/>

    </linearGradient>


    <!-- =========================================================
         COUNTERTOP
         ========================================================= -->

    <linearGradient
        id="cabinet-counter"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#55595a"/>

      <stop offset="100%"
            stop-color="#35383a"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       CABINET SYSTEM
       ========================================================= -->

  <g id="cabinets">


    <!-- =========================================================
         UPPER CABINET BLOCK
         ========================================================= -->

    <g id="upper-cabinets">


      <!-- Large left cabinet -->

      <rect
          x="110"
          y="0"
          width="625"
          height="275"
          fill="url(#cabinet-white)"
          stroke="#b8b9b6"
          stroke-width="3"/>


      <!-- extra division for the widened run -->

      <line
          x1="655"
          y1="0"
          x2="655"
          y2="275"
          stroke="#b6b7b4"
          stroke-width="3"/>


      <!-- extra handle -->

      <rect
          x="615"
          y="120"
          width="10"
          height="52"
          rx="4"
          fill="#8e908d"/>


      <!-- =======================================================
           (extractor hood moved below, after the backsplash,
           so it isn't painted over — see near the end of this
           group)
           ======================================================= -->


      <!-- Left vertical division -->

      <line
          x1="340"
          y1="0"
          x2="340"
          y2="275"
          stroke="#b6b7b4"
          stroke-width="3"/>


      <!-- Right vertical division -->

      <line
          x1="505"
          y1="0"
          x2="505"
          y2="275"
          stroke="#b6b7b4"
          stroke-width="3"/>


      <!-- =======================================================
           CABINET DOOR SHADOWS
           ======================================================= -->

      <rect
          x="118"
          y="8"
          width="214"
          height="255"
          fill="#ffffff"
          opacity=".18"/>

      <rect
          x="348"
          y="8"
          width="148"
          height="255"
          fill="#ffffff"
          opacity=".12"/>

      <rect
          x="513"
          y="8"
          width="64"
          height="255"
          fill="#ffffff"
          opacity=".08"/>


      <!-- =======================================================
           CABINET HANDLES
           ======================================================= -->

      <rect
          x="300"
          y="120"
          width="10"
          height="52"
          rx="4"
          fill="#8e908d"/>

      <rect
          x="470"
          y="120"
          width="10"
          height="52"
          rx="4"
          fill="#8e908d"/>


    </g>


    <!-- =========================================================
         BACKSPLASH
         ========================================================= -->

    <rect
        x="0"
        y="275"
        width="780"
        height="170"
        fill="#e7e8e4"/>


    <!-- =========================================================
         SUBWAY TILE BACKSPLASH
         ========================================================= -->

    <g
        id="backsplash"
        stroke="#c4c6c3"
        stroke-width="2"
        opacity=".85">


      <!-- horizontal grout -->

      <line
          x1="0"
          y1="315"
          x2="780"
          y2="315"/>

      <line
          x1="0"
          y1="355"
          x2="780"
          y2="355"/>

      <line
          x1="0"
          y1="395"
          x2="780"
          y2="395"/>

      <line
          x1="0"
          y1="435"
          x2="780"
          y2="435"/>


      <!-- vertical grout -->

      <g>

        <line x1="55" y1="275" x2="55" y2="315"/>
        <line x1="165" y1="275" x2="165" y2="315"/>
        <line x1="275" y1="275" x2="275" y2="315"/>
        <line x1="385" y1="275" x2="385" y2="315"/>
        <line x1="495" y1="275" x2="495" y2="315"/>
        <line x1="605" y1="275" x2="605" y2="315"/>
        <line x1="715" y1="275" x2="715" y2="315"/>

        <line x1="0" y1="315" x2="0" y2="355"/>
        <line x1="110" y1="315" x2="110" y2="355"/>
        <line x1="220" y1="315" x2="220" y2="355"/>
        <line x1="330" y1="315" x2="330" y2="355"/>
        <line x1="440" y1="315" x2="440" y2="355"/>
        <line x1="550" y1="315" x2="550" y2="355"/>
        <line x1="660" y1="315" x2="660" y2="355"/>
        <line x1="770" y1="315" x2="770" y2="355"/>

        <line x1="55" y1="355" x2="55" y2="395"/>
        <line x1="165" y1="355" x2="165" y2="395"/>
        <line x1="275" y1="355" x2="275" y2="395"/>
        <line x1="385" y1="355" x2="385" y2="395"/>
        <line x1="495" y1="355" x2="495" y2="395"/>
        <line x1="605" y1="355" x2="605" y2="395"/>
        <line x1="715" y1="355" x2="715" y2="395"/>

        <line x1="0" y1="395" x2="0" y2="435"/>
        <line x1="110" y1="395" x2="110" y2="435"/>
        <line x1="220" y1="395" x2="220" y2="435"/>
        <line x1="330" y1="395" x2="330" y2="435"/>
        <line x1="440" y1="395" x2="440" y2="435"/>
        <line x1="550" y1="395" x2="550" y2="435"/>
        <line x1="660" y1="395" x2="660" y2="435"/>
        <line x1="770" y1="395" x2="770" y2="435"/>

      </g>

    </g>


    <!-- =========================================================
         COUNTERTOP
         ========================================================= -->

    <rect
        x="0"
        y="438"
        width="780"
        height="32"
        fill="url(#cabinet-counter)"/>


    <!-- Counter front edge -->

    <rect
        x="0"
        y="466"
        width="780"
        height="12"
        fill="#292c2d"/>


    <!-- =========================================================
         LOWER CABINET BANK
         ========================================================= -->

    <g id="lower-cabinets">


      <!-- Main cabinet body -->

      <rect
          x="0"
          y="478"
          width="780"
          height="242"
          fill="url(#cabinet-white)"
          stroke="#b5b6b3"
          stroke-width="3"/>


      <!-- =======================================================
           DOOR / APPLIANCE DIVISIONS
           ======================================================= -->

      <line
          x1="125"
          y1="478"
          x2="125"
          y2="720"
          stroke="#b5b6b3"
          stroke-width="3"/>


      <line
          x1="390"
          y1="478"
          x2="390"
          y2="720"
          stroke="#b5b6b3"
          stroke-width="3"/>


      <line
          x1="500"
          y1="478"
          x2="500"
          y2="720"
          stroke="#b5b6b3"
          stroke-width="3"/>


      <!-- =======================================================
           LEFT CABINET DOOR
           ======================================================= -->

      <rect
          x="8"
          y="486"
          width="109"
          height="226"
          fill="#e4e5e1"
          opacity=".55"/>


      <!-- handle -->

      <rect
          x="40"
          y="585"
          width="48"
          height="7"
          rx="3"
          fill="#858783"/>


      <!-- =======================================================
           CABINET UNDER FRIDGE
           ======================================================= -->

      <rect
          x="400"
          y="486"
          width="90"
          height="226"
          fill="#e3e4e0"
          opacity=".35"/>


      <!-- handle -->

      <rect
          x="420"
          y="585"
          width="48"
          height="7"
          rx="3"
          fill="#858783"/>


      <!-- =======================================================
           FAR RIGHT CABINET
           ======================================================= -->

      <rect
          x="510"
          y="486"
          width="82"
          height="226"
          fill="#e1e2de"
          opacity=".45"/>


      <rect
          x="525"
          y="585"
          width="45"
          height="7"
          rx="3"
          fill="#858783"/>


      <!-- =======================================================
           EXTENSION CABINET (widened run)
           ======================================================= -->

      <line
          x1="600"
          y1="478"
          x2="600"
          y2="720"
          stroke="#b5b6b3"
          stroke-width="3"/>

      <rect
          x="608"
          y="486"
          width="164"
          height="226"
          fill="#e4e5e1"
          opacity=".5"/>

      <rect
          x="670"
          y="585"
          width="48"
          height="7"
          rx="3"
          fill="#858783"/>


    </g>


    <!-- =========================================================
         EXTRACTOR HOOD — mounted under the cabinets, centered
         above the hob/oven column. Drawn here (after the
         backsplash) so it isn't painted over.
         ========================================================= -->

    <g id="extractor-hood">

      <path
          d="
            M240 275
            L460 275
            L415 345
            L285 345
            Z"
          fill="#4a4d4f"
          stroke="#333537"
          stroke-width="3"/>

      <rect
          x="240"
          y="270"
          width="220"
          height="10"
          rx="2"
          fill="#3a3c3e"/>

      <rect
          x="300"
          y="320"
          width="100"
          height="8"
          fill="#5c5f61"
          opacity=".6"/>

    </g>


    <!-- =========================================================
         CABINET BASE / KICKBOARD
         ========================================================= -->

    <rect
        x="0"
        y="712"
        width="780"
        height="8"
        fill="#aaaCA9"/>


  </g>

</svg>
<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 720 430"
    width="720"
    height="430">

  <defs>

    <!-- =========================================================
         SOFA FABRIC
         ========================================================= -->

    <linearGradient
        id="sofa-fabric"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#9a9da0"/>

      <stop offset="100%"
            stop-color="#777b7e"/>

    </linearGradient>


    <linearGradient
        id="sofa-seat"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#a5a8aa"/>

      <stop offset="100%"

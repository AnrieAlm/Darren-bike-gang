<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 190 235"
    width="190"
    height="235">

  <defs>

    <linearGradient
        id="fridge-body"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#d6d7d3"/>

      <stop offset="45%"
            stop-color="#eeeeea"/>

      <stop offset="100%"
            stop-color="#c6c8c5"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       FRIDGE — small under-counter unit, single door.
       Matches the height of the oven/counter run in the photo,
       not a full-height fridge-freezer.
       ========================================================= -->

  <g
      id="fridge"
      class="hotspot"
      data-spot="fridge">


    <!-- Game interaction area -->

    <rect
        class="hit"
        x="0"
        y="0"
        width="190"
        height="235"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         MAIN BODY
         ========================================================= -->

    <rect
        x="3"
        y="2"
        width="184"
        height="231"
        rx="4"
        fill="url(#fridge-body)"
        stroke="#aeb1ae"
        stroke-width="3"/>


    <!-- top edge highlight -->

    <rect
        x="3"
        y="2"
        width="184"
        height="8"
        fill="#f4f4f0"/>


    <!-- =========================================================
         SINGLE DOOR
         ========================================================= -->

    <rect
        x="10"
        y="16"
        width="170"
        height="195"
        rx="3"
        fill="#e4e5e1"
        stroke="#b9bbb8"
        stroke-width="2"/>


    <!-- door highlight -->

    <path
        d="
          M20 26
          L165 26
          L165 200
          L20 200
          Z"
        fill="#f2f2ee"
        opacity=".4"/>


    <!-- =========================================================
         HANDLE — single vertical bar, right edge
         ========================================================= -->

    <rect
        x="163"
        y="55"
        width="8"
        height="110"
        rx="3"
        fill="#999b98"/>

    <rect
        x="165"
        y="60"
        width="2.5"
        height="95"
        rx="1"
        fill="#d4d5d1"/>


    <!-- =========================================================
         BRAND — matches the "NORDMENOK" fridge in the photo
         ========================================================= -->

    <text
        x="95"
        y="60"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11"
        letter-spacing="1"
        fill="#b9bbb7"
        opacity=".85">
      NORDMENOK
    </text>


    <!-- =========================================================
         BOTTOM KICK PLATE
         ========================================================= -->

    <rect
        x="10"
        y="221"
        width="170"
        height="9"
        fill="#c2c4c1"/>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <rect
        class="glow"
        x="3"
        y="2"
        width="184"
        height="231"
        rx="4"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>

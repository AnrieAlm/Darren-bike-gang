<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 190 305"
    width="190"
    height="305">

  <defs>

    <linearGradient
        id="fridgeBody"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#d8d9d5"/>

      <stop offset="45%"
            stop-color="#eeeeea"/>

      <stop offset="100%"
            stop-color="#c8cac7"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       FRIDGE
       ========================================================= -->

  <g
      id="fridge"
      class="hotspot"
      data-spot="fridge">


    <!-- Game interaction area -->

    <rect
        class="hit"
        x="0"
        y="0"
        width="190"
        height="305"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         MAIN BODY
         ========================================================= -->

    <rect
        x="3"
        y="2"
        width="184"
        height="300"
        rx="4"
        fill="url(#fridgeBody)"
        stroke="#aeb1ae"
        stroke-width="3"/>


    <!-- =========================================================
         TOP FREEZER DOOR
         ========================================================= -->

    <rect
        x="10"
        y="10"
        width="170"
        height="78"
        rx="3"
        fill="#dedfdb"
        stroke="#b9bbb8"
        stroke-width="2"/>


    <!-- freezer subtle highlight -->

    <rect
        x="18"
        y="18"
        width="154"
        height="58"
        rx="2"
        fill="#e9e9e5"
        opacity=".55"/>


    <!-- =========================================================
         MAIN FRIDGE DOOR
         ========================================================= -->

    <rect
        x="10"
        y="94"
        width="170"
        height="197"
        rx="3"
        fill="#dfe0dc"
        stroke="#b8bab7"
        stroke-width="2"/>


    <!-- door highlight -->

    <path
        d="
          M20 105
          L165 105
          L165 280
          L20 280
          Z"
        fill="#f2f2ee"
        opacity=".35"/>


    <!-- =========================================================
         DOOR SEAM
         ========================================================= -->

    <line
        x1="10"
        y1="91"
        x2="180"
        y2="91"
        stroke="#aeb0ad"
        stroke-width="3"/>


    <!-- =========================================================
         HANDLES
         ========================================================= -->

    <rect
        x="164"
        y="27"
        width="7"
        height="43"
        rx="3"
        fill="#999b98"/>

    <rect
        x="164"
        y="125"
        width="7"
        height="85"
        rx="3"
        fill="#999b98"/>


    <!-- handle highlights -->

    <rect
        x="166"
        y="30"
        width="2"
        height="37"
        rx="1"
        fill="#d4d5d1"/>

    <rect
        x="166"
        y="130"
        width="2"
        height="74"
        rx="1"
        fill="#d4d5d1"/>


    <!-- =========================================================
         SMALL FRIDGE BRAND DETAIL
         ========================================================= -->

    <text
        x="95"
        y="150"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="8"
        fill="#858784"
        opacity=".7">
      HOME
    </text>


    <!-- =========================================================
         BOTTOM KICK PLATE
         ========================================================= -->

    <rect
        x="10"
        y="291"
        width="170"
        height="10"
        fill="#c2c4c1"/>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <rect
        class="glow"
        x="3"
        y="2"
        width="184"
        height="300"
        rx="4"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>
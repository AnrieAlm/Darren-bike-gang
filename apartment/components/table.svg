<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 420 280"
    width="420"
    height="280">

  <defs>

    <linearGradient
        id="table-top"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#f4f4f1"/>

      <stop offset="70%"
            stop-color="#e6e6e2"/>

      <stop offset="100%"
            stop-color="#d3d4d1"/>

    </linearGradient>


    <linearGradient
        id="table-pedestal"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#4b4b4e"/>

      <stop offset="50%"
            stop-color="#6a6a6d"/>

      <stop offset="100%"
            stop-color="#3a3a3d"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       TABLE — small round dining table, single slim leg,
       matching the compact table in the photo (not a large
       banquet oval).
       ========================================================= -->

  <g
      id="table"
      class="hotspot table"
      data-spot="table">


    <!-- =========================================================
         INVISIBLE GAME HIT AREA
         ========================================================= -->

    <ellipse
        class="hit"
        cx="210"
        cy="110"
        rx="205"
        ry="90"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         FLOOR CONTACT SHADOW
         ========================================================= -->

    <ellipse
        cx="210"
        cy="258"
        rx="150"
        ry="16"
        fill="#000000"
        opacity=".14"/>


    <!-- =========================================================
         PEDESTAL LEG
         ========================================================= -->

    <rect
        x="200"
        y="150"
        width="20"
        height="95"
        fill="url(#table-pedestal)"/>


    <!-- pedestal foot -->

    <ellipse
        cx="210"
        cy="248"
        rx="60"
        ry="13"
        fill="#3a3a3d"/>

    <ellipse
        cx="210"
        cy="244"
        rx="52"
        ry="9"
        fill="#55565a"/>


    <!-- =========================================================
         UNDERSIDE / EDGE (drawn before the top so the top
         overlaps its rim, giving the disc some thickness)
         ========================================================= -->

    <ellipse
        cx="210"
        cy="128"
        rx="205"
        ry="88"
        fill="#b7b9b6"/>


    <!-- =========================================================
         MAIN TABLETOP
         ========================================================= -->

    <ellipse
        cx="210"
        cy="118"
        rx="205"
        ry="88"
        fill="url(#table-top)"
        stroke="#c6c7c4"
        stroke-width="3"/>


    <!-- soft light across the top -->

    <ellipse
        cx="185"
        cy="95"
        rx="140"
        ry="45"
        fill="#ffffff"
        opacity=".25"/>


    <!-- =========================================================
         SPACE UNDER THE TABLE — where a hidden item can be
         tucked and later revealed (kept for the game's
         "peek under the table" mechanic)
         ========================================================= -->

    <g class="interior">

      <text
          class="found-item-emoji"
          data-spot="table"
          x="210"
          y="185"
          font-size="30"
          text-anchor="middle"/>

    </g>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <ellipse
        class="glow"
        cx="210"
        cy="118"
        rx="205"
        ry="88"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>

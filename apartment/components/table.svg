<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1050 500"
    width="1050"
    height="500">

  <defs>

    <!-- =========================================================
         TABLETOP MATERIAL
         ========================================================= -->

    <linearGradient
        id="tableTop"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#eeeeeb"/>

      <stop offset="65%"
            stop-color="#dedfdd"/>

      <stop offset="100%"
            stop-color="#c9cbc9"/>

    </linearGradient>


    <!-- =========================================================
         TABLE EDGE
         ========================================================= -->

    <linearGradient
        id="tableEdge"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#aeb0ae"/>

      <stop offset="100%"
            stop-color="#858886"/>

    </linearGradient>


    <!-- =========================================================
         PEDESTAL
         ========================================================= -->

    <linearGradient
        id="pedestal"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

      <stop offset="0%"
            stop-color="#777a78"/>

      <stop offset="50%"
            stop-color="#9b9d9b"/>

      <stop offset="100%"
            stop-color="#686b69"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       TABLE ROOT
       ========================================================= -->

  <g
      id="table"
      class="hotspot"
      data-spot="table">


    <!-- =========================================================
         INVISIBLE GAME HIT AREA
         ========================================================= -->

    <ellipse
        class="hit"
        cx="525"
        cy="190"
        rx="515"
        ry="155"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         TABLE PEDESTAL
         ========================================================= -->

    <g id="table-base">


      <!-- central support -->

      <path
          d="
            M470 300
            L580 300
            L615 450
            L435 450
            Z"
          fill="url(#pedestal)"
          stroke="#686b69"
          stroke-width="4"/>


      <!-- pedestal highlight -->

      <path
          d="
            M485 310
            L520 310
            L545 435
            L470 435
            Z"
          fill="#b4b6b4"
          opacity=".22"/>


      <!-- base -->

      <ellipse
          cx="525"
          cy="450"
          rx="145"
          ry="28"
          fill="#686b69"/>


      <ellipse
          cx="525"
          cy="444"
          rx="125"
          ry="18"
          fill="#858886"/>

    </g>


    <!-- =========================================================
         TABLE EDGE / FRONT
         This is behind the tabletop so the tabletop sits above it.
         ========================================================= -->

    <path
        d="
          M20 190
          Q25 330 525 360
          Q1025 330 1030 190
          L1025 230
          Q975 345 525 375
          Q75 345 25 230
          Z"
        fill="url(#tableEdge)"
        stroke="#777a78"
        stroke-width="3"/>


    <!-- =========================================================
         MAIN TABLETOP
         ========================================================= -->

    <ellipse
        cx="525"
        cy="185"
        rx="515"
        ry="150"
        fill="url(#tableTop)"
        stroke="#888b89"
        stroke-width="6"/>


    <!-- =========================================================
         INNER TOP EDGE
         ========================================================= -->

    <ellipse
        cx="525"
        cy="185"
        rx="497"
        ry="134"
        fill="none"
        stroke="#c1c3c1"
        stroke-width="3"/>


    <!-- =========================================================
         SOFT TABLETOP LIGHT
         ========================================================= -->

    <ellipse
        cx="500"
        cy="155"
        rx="390"
        ry="80"
        fill="#ffffff"
        opacity=".17"/>


    <!-- =========================================================
         FRONT EDGE HIGHLIGHT
         ========================================================= -->

    <path
        d="
          M45 200
          Q110 305 525 330
          Q940 305 1005 200"
        fill="none"
        stroke="#a4a6a4"
        stroke-width="7"
        opacity=".65"/>


    <!-- =========================================================
         SMALL EDGE SHADOW
         ========================================================= -->

    <path
        d="
          M70 224
          Q160 320 525 340
          Q890 320 980 224"
        fill="none"
        stroke="#777a78"
        stroke-width="5"
        opacity=".35"/>


    <!-- =========================================================
         INTERACTION GLOW
         ========================================================= -->

    <ellipse
        class="glow"
        cx="525"
        cy="185"
        rx="515"
        ry="150"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>
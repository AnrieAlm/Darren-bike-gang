<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 180 115"
    width="180"
    height="115">

  <defs>

    <linearGradient
        id="microwaveBody"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#eeeeea"/>

      <stop offset="100%"
            stop-color="#cfd0cc"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       MICROWAVE
       ========================================================= -->

  <g
      id="microwave"
      class="hotspot"
      data-spot="microwave">


    <!-- Game interaction area -->

    <rect
        class="hit"
        x="0"
        y="0"
        width="180"
        height="115"
        fill="#ffffff"
        opacity="0"/>


    <!-- =========================================================
         BODY
         ========================================================= -->

    <rect
        x="2"
        y="2"
        width="176"
        height="111"
        rx="5"
        fill="url(#microwaveBody)"
        stroke="#aaa9a4"
        stroke-width="3"/>


    <!-- =========================================================
         MICROWAVE WINDOW
         ========================================================= -->

    <rect
        x="13"
        y="14"
        width="113"
        height="82"
        rx="3"
        fill="#292b2c"/>


    <rect
        x="20"
        y="20"
        width="99"
        height="69"
        fill="#151718"/>


    <!-- subtle glass reflection -->

    <path
        d="
          M24 24
          L113 24
          L85 45
          L24 45
          Z"
        fill="#ffffff"
        opacity=".045"/>


    <!-- =========================================================
         HANDLE
         ========================================================= -->

    <rect
        x="117"
        y="28"
        width="5"
        height="55"
        rx="2"
        fill="#5e6060"/>


    <!-- =========================================================
         CONTROL SECTION
         ========================================================= -->

    <rect
        x="135"
        y="14"
        width="30"
        height="82"
        rx="3"
        fill="#d0d1cd"/>


    <!-- upper control -->

    <circle
        cx="150"
        cy="34"
        r="8"
        fill="#888a87"
        stroke="#6d6f6d"
        stroke-width="2"/>


    <!-- lower control -->

    <circle
        cx="150"
        cy="62"
        r="8"
        fill="#888a87"
        stroke="#6d6f6d"
        stroke-width="2"/>


    <!-- little display -->

    <rect
        x="141"
        y="78"
        width="18"
        height="9"
        rx="2"
        fill="#666966"/>


    <!-- =========================================================
         FEET
         ========================================================= -->

    <rect
        x="15"
        y="105"
        width="18"
        height="6"
        rx="2"
        fill="#858682"/>

    <rect
        x="142"
        y="105"
        width="18"
        height="6"
        rx="2"
        fill="#858682"/>


    <!-- Interaction outline -->

    <rect
        class="glow"
        x="2"
        y="2"
        width="176"
        height="111"
        rx="5"
        fill="none"
        pointer-events="none"/>

  </g>

</svg>
<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1536 900"
    width="1536"
    height="900">

  <defs>

    <!-- =========================================================
         WALL
         ========================================================= -->

    <linearGradient
        id="wall"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#eef0ed"/>

      <stop offset="100%"
            stop-color="#dfe2df"/>

    </linearGradient>


    <!-- =========================================================
         FLOOR
         ========================================================= -->

    <linearGradient
        id="floor"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop offset="0%"
            stop-color="#c9ccc9"/>

      <stop offset="100%"
            stop-color="#aeb2af"/>

    </linearGradient>


    <!-- =========================================================
         WINDOW-LIGHT WASH
         ========================================================= -->

    <linearGradient
        id="lightWash"
        x1="1"
        y1="0"
        x2="0"
        y2="0">

      <stop offset="0%"
            stop-color="#ffffff"
            stop-opacity=".42"/>

      <stop offset="65%"
            stop-color="#ffffff"
            stop-opacity=".12"/>

      <stop offset="100%"
            stop-color="#ffffff"
            stop-opacity="0"/>

    </linearGradient>

  </defs>


  <!-- =========================================================
       ROOM
       ========================================================= -->

  <g id="room-shell">


    <!-- =======================================================
         BACK WALL
         ======================================================= -->

    <rect
        x="0"
        y="0"
        width="1536"
        height="625"
        fill="url(#wall)"/>


    <!-- =======================================================
         LEFT WALL SLIGHT COOL SHADOW
         ======================================================= -->

    <rect
        x="0"
        y="0"
        width="90"
        height="625"
        fill="#d9dddb"
        opacity=".38"/>


    <!-- =======================================================
         CEILING
         ======================================================= -->

    <path
        d="
          M0 0
          L1536 0
          L1536 65
          L0 65
          Z"
        fill="#f4f5f2"/>


    <!-- ceiling seam -->

    <line
        x1="0"
        y1="65"
        x2="1536"
        y2="65"
        stroke="#d3d5d2"
        stroke-width="3"/>


    <!-- =======================================================
         FLOOR
         ======================================================= -->

    <path
        d="
          M0 625
          L1536 625
          L1536 900
          L0 900
          Z"
        fill="url(#floor)"/>


    <!-- =======================================================
         FLOOR / WALL LINE
         ======================================================= -->

    <rect
        x="0"
        y="616"
        width="1536"
        height="15"
        fill="#b4b8b5"/>


    <rect
        x="0"
        y="616"
        width="1536"
        height="5"
        fill="#e0e2df"
        opacity=".65"/>


    <!-- =======================================================
         SUBTLE FLOOR DIRECTION
         ======================================================= -->

    <path
        d="
          M0 710
          Q750 680 1536 710

          M0 800
          Q750 770 1536 800

          M0 875
          Q750 850 1536 875"
        fill="none"
        stroke="#a3a8a5"
        stroke-width="3"
        opacity=".18"/>


    <!-- =======================================================
         WINDOW LIGHT SPILL
         ======================================================= -->

    <path
        d="
          M1080 120
          L1536 120
          L1536 700
          Q1330 650 1050 705
          Z"
        fill="url(#lightWash)"/>


    <!-- =======================================================
         SOFT FLOOR SHADOW FROM WINDOW
         ======================================================= -->

    <path
        d="
          M1110 625
          Q1330 580 1536 625
          L1536 800
          Q1320 755 1070 800
          Z"
        fill="#ffffff"
        opacity=".07"/>


    <!-- =======================================================
         CORNER SHADOW
         ======================================================= -->

    <path
        d="
          M1500 65
          L1536 65
          L1536 625
          L1495 625
          Z"
        fill="#cdd1ce"
        opacity=".25"/>


  </g>

</svg>